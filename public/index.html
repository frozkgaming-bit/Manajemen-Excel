<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olah Data EXCEL BOS EDS</title>
    <link rel="stylesheet" href="style.css">
    <!-- Tambahkan library Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <!-- Floating Progress Bar (Non-blocking, Bottom Right) -->
    <div id="progressModal" style="display: none; position: fixed; bottom: 24px; right: 24px; z-index: 9999; max-width: 380px; width: calc(100% - 48px); pointer-events: auto;">
        <div style="background: #ffffff; padding: 16px 20px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); border: 1px solid #dcdfe6;">
            <h4 id="progressTitle" style="margin: 0 0 8px; font-size: 14px; font-weight: 600; color: #2c3e50;">Memproses Data...</h4>
            <div style="width: 100%; background-color: #ebeef5; border-radius: 6px; overflow: hidden; height: 12px; margin-bottom: 8px;">
                <div id="progressBar" style="width: 0%; height: 100%; background-color: #28a745; transition: width 0.2s ease;"></div>
            </div>
            <div id="progressText" style="font-size: 12px; font-weight: 500; color: #606266; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Menyiapkan data...</div>
        </div>
    </div>
    <div id="loginSection" style="max-width: 300px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px;">
        <h2>Login Sistem</h2>
        <div style="margin-bottom: 10px;">
            <label for="loginUsername">Username:</label><br>
            <input type="text" id="loginUsername" style="width: 100%; padding: 5px;" placeholder="Masukkan username...">
        </div>
        <div style="margin-bottom: 15px;">
            <label for="loginPassword">Password:</label><br>
            <input type="password" id="loginPassword" style="width: 100%; padding: 5px;">
        </div>
        <button id="btnLogin" style="width: 100%; padding: 8px; background-color: #007bff; color: white; border: none; cursor: pointer;">Login</button>
        <div id="loginError" style="color: red; margin-top: 10px; font-size: 12px; display: none;"></div>
    </div>

    <!-- BAGIAN APLIKASI UTAMA (Disembunyikan pada awalnya) -->
    <div id="appSection" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Data EXCEL BOS EDS</h2>
            <button id="btnLogout" style="padding: 5px 10px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">Logout</button>
        </div>
        
        <div id="controls">
            <!-- (Isi kontrol sama seperti kode asli Anda: fileUploadMain, fileUploadDone, btnPullData, dll) -->
            <div class="upload-group">
                <label for="fileUploadMain">Upload Basis Data Utama:</label>
                <input type="file" id="fileUploadMain" accept=".xlsx, .xls, .csv" />
            </div>
            <div class="upload-group" style="margin-top: 10px;">
                <label for="fileUploadDone">Upload Data Selesai (Otomatis "Selesai"):</label>
                <input type="file" id="fileUploadDone" accept=".xlsx, .xls, .csv" />
            </div>
            <div class="upload-group" style="margin-top: 10px;">
                <button id="btnPullData" style="padding: 8px 15px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px;">
                    Tarik Seluruh Data dari Supabase
                </button>
<button id="btnPrint" style="padding: 8px 15px; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 4px; margin-left: 10px;">
                Export ke Excel
            </button>
            </div>

            <!-- DWG File Upload Section -->
            <div class="upload-group" style="margin-top: 10px; padding: 15px; background: #f8f9fa; border-radius: 5px; border: 1px solid #dee2e6;">
                <h4 style="margin: 0 0 10px 0; color: #495057;">Upload File AutoCAD (.dwg)</h4>
                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <input type="file" id="dwgFileInput" accept=".dwg" style="flex-grow: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" />
                    <button id="uploadBtn" class="btn" style="padding: 8px 15px; background-color: #17a2b8; color: white; border: none; border-radius: 4px; cursor: pointer; white-space: nowrap;">
                        Unggah ke Supabase
                    </button>
                </div>
                <div id="uploadStatus" style="margin-top: 8px; font-size: 13px; color: #666;"></div>
            </div>
            
            <div style="margin-top: 15px; display: flex; gap: 10px; align-items: center;">
            <select id="searchCategory" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                <option value="all">Semua Kategori</option>
            </select>
            <div style="display: flex; flex-grow: 1; gap: 5px;">
                <input type="text" id="searchInput" placeholder="Cari data..." autocomplete="off" style="flex-grow: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                <button id="btnSearch" style="padding: 8px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;" title="Cari">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                    </svg>
                </button>
            </div>
        </div>
            <div id="dataSummary" style="margin-top: 15px; padding: 10px; background-color: #e9ecef; border-radius: 5px; font-weight: bold; border: 1px solid #ccc;">
                  Total Data: <span id="countTotal" style="color: blue;">0</span> | 
                  Selesai: <span id="countSelesai" style="color: green;">0</span> | 
                  Belum Selesai: <span id="countBelum" style="color: red;">0</span>
                <span id="filterSummary" style="display: none; margin-left: 10px; padding-left: 10px; border-left: 2px solid #aaa;">
                      Ditemukan: <span id="countFiltered" style="color: #d35400;">0</span>
                </span>
            </div>
        </div>
        
        <div id="tableScrollWrapper">
            <table id="dataTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
            <div id="progressContainer" style="display: none; margin-top: 15px; padding: 10px; background: #f8f9fa; border: 1px solid #ccc; border-radius: 5px;">
                <div id="progressText" style="text-align: center; font-weight: bold; margin-bottom: 8px;">Memuat data...</div>
                <div style="width: 100%; background-color: #e9ecef; border-radius: 5px; overflow: hidden;">
                    <div id="progressBar" style="width: 0%; height: 20px; background-color: #28a745; transition: width 0.3s ease;"></div>
                </div>
            </div>
        </div>

        <!-- DWG File List Section -->
        <div id="dwgFileListSection" style="margin-top: 20px;">
            <h3 style="color: #495057; margin-bottom: 10px;">Daftar File DWG Tersimpan</h3>
            <ul id="dwgFileList" style="list-style: none; padding: 0; margin: 0; background: white; border: 1px solid #dee2e6; border-radius: 5px;">
                <li style="color: #666; padding: 10px; text-align: center;">Memuat daftar file...</li>
            </ul>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
