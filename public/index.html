<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>BOS EDS - Manajemen Data Pertanahan</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <style data-purpose="custom-scrollbars">
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">
    <div id="nav-container"></div>
    <main id="app"></main>
    <div id="footer-container"></div>

    <div id="progressModal" style="display: none; position: fixed; bottom: 24px; right: 24px; z-index: 9999; max-width: 380px; width: calc(100% - 48px); pointer-events: auto;">
        <div style="background: #ffffff; padding: 16px 20px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); border: 1px solid #dcdfe6;">
            <h4 id="progressTitle" style="margin: 0 0 8px; font-size: 14px; font-weight: 600; color: #2c3e50;">Memproses Data...</h4>
            <div style="width: 100%; background-color: #ebeef5; border-radius: 6px; overflow: hidden; height: 12px; margin-bottom: 8px;">
                <div id="progressBar" style="width: 0%; height: 100%; background-color: #28a745; transition: width 0.2s ease;"></div>
            </div>
            <div id="progressText" style="font-size: 12px; font-weight: 500; color: #606266; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Menyiapkan data...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="module" src="js/index.js"></script>
</body>
</html>
